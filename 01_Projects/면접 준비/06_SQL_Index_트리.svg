<text x="615" y="371" fill="#06766a" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="17" font-weight="750" text-anchor="start">리프 · PK 101·205</text>
<path d="M615 383 H811" fill="none" stroke="#d7e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="615" y="409" fill="#182640" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="start">101 · 창고 7 · 수량 12</text>
<text x="615" y="436" fill="#182640" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="start">205 · 창고 7 · 수량 5</text>
<rect x="835" y="341" width="222" height="128" rx="13" fill="#f7f9fd" stroke="#d7e2ee"/>
<text x="848" y="371" fill="#06766a" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="17" font-weight="750" text-anchor="start">리프 · PK 307</text>
<path d="M848 383 H1044" fill="none" stroke="#d7e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="848" y="409" fill="#182640" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="start">307 · 창고 8 · 수량 20</text>
<rect x="40" y="570" width="1040" height="54" rx="12" fill="#e7edf6" stroke="none"/>
<text x="60" y="604" fill="#2856b5" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="start">창고 7에서 id만 조회 → PK 101 · 205</text>
<text x="563" y="604" fill="#06766a" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="start">수량까지 조회 → PK로 행을 다시 찾아 12 · 5</text>
</svg>
