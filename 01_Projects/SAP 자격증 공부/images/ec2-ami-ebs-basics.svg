</ns0:svg><text x="225" y="338" font-size="27" font-weight="700" text-anchor="middle">AMI</text>
<text x="225" y="381" font-size="23" text-anchor="middle">OS·소프트웨어의 시작 기준</text>
<text x="225" y="421" font-size="21" text-anchor="middle">例：Linux＋웹 앱 v1</text>
<text x="710" y="220" font-size="26" font-weight="700">EC2 인스턴스 A</text>
<text x="615" y="292" font-size="22">CPU·메모리로 앱 실행</text>
<text x="710" y="505" font-size="26" font-weight="700">EC2 인스턴스 B</text>
<text x="615" y="577" font-size="22">CPU·메모리로 앱 실행</text>
<text x="1220" y="220" font-size="24" font-weight="700">A의 EBS 볼륨</text>
<text x="1134" y="292" font-size="22">OS·앱·파일 저장 공간</text>
<text x="1220" y="505" font-size="24" font-weight="700">B의 EBS 볼륨</text>
<text x="1134" y="577" font-size="22">A와 별개인 저장 공간</text>
<text x="44" y="688" font-size="21">EBS 기반 AMI 예시 · 인스턴스별 별도 볼륨 · 자동 파일 공유/동기화 아님 · AWS 공식 아이콘으로 작성한 학습용 그림</text>
