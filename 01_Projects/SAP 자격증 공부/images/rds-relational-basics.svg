</svg><text x="1030" y="385" font-size="27" fill="#243247" font-weight="700">RDS for PostgreSQL</text><text x="915" y="435" font-size="22" fill="#243247" font-weight="400">DB 엔드포인트 + 포트 + DB 로그인 정보</text><path d="M 555 320 H 835" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="835,320 817,312 817,328" fill="#1673b8"/><text x="570" y="280" font-size="22" fill="#243247" font-weight="700">DB 프로토콜</text><text x="570" y="360" font-size="23" fill="#243247" font-weight="700">TCP 5432</text><text x="65" y="550" font-size="23" fill="#243247" font-weight="400">화살표는 연결 관계다. DB 접속에는 네트워크 허용과 DB 인증·권한이 모두 필요하다.</text><text x="45" y="625" font-size="24" fill="#243247" font-weight="700">RDS 안의 논리적 테이블 예제 · 테이블은 EC2나 EBS 볼륨을 뜻하지 않는다.</text><rect x="45" y="660" width="650" height="235" rx="8" fill="#fbfcfe" stroke="#7d9fbb" stroke-width="2" stroke-dasharray=""/><rect x="805" y="660" width="750" height="235" rx="8" fill="#fbfcfe" stroke="#7d9fbb" stroke-width="2" stroke-dasharray=""/><text x="70" y="705" font-size="26" fill="#243247" font-weight="700">Customers · 고객 테이블</text><text x="70" y="752" font-size="23" fill="#243247" font-weight="400">customer_id (기본 키)        name</text><text x="70" y="802" font-size="23" fill="#243247" font-weight="400">11                                    민지</text><text x="70" y="850" font-size="23" fill="#243247" font-weight="400">12                                    준호</text><text x="830" y="705" font-size="26" fill="#243247" font-weight="700">Orders · 주문 테이블</text><text x="830" y="752" font-size="21" fill="#243247" font-weight="400">order_id (기본 키)    customer_id (외래 키)    amount</text><text x="830" y="802" font-size="22" fill="#243247" font-weight="400">501                        11                                  12000</text><text x="830" y="850" font-size="22" fill="#243247" font-weight="400">502                        12                                  18000</text><path d="M 790 810 H 710" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="710,810 728,802 728,818" fill="#1673b8"/><text x="55" y="950" font-size="23" fill="#243247" font-weight="400">AWS: 기반 인프라·관리형 OS/DB 운영 작업   /   사용자: 테이블·SQL·권한·업무 로직·설정 선택</text><text x="55" y="1000" font-size="22" fill="#243247" font-weight="400">일반 RDS for PostgreSQL 예제다. RDS Custom·Aurora·HA 배치·서브넷 그룹의 상세 구성은 다음에 다룬다.</text><text x="55" y="1040" font-size="22" fill="#243247" font-weight="400">RDS 관리 기능이 잘못 작성한 주문 처리나 SQL을 자동으로 올바르게 바꿔 주지는 않는다.</text><text x="1060" y="480" font-size="22" fill="#243247">DB에 연결된 SG-DB</text></g></svg>