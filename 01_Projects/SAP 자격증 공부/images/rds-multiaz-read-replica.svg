</svg><text x="1290" y="637" font-size="24" fill="#243247" font-weight="700">Read replica</text><text x="860" y="687" font-size="22" fill="#243247" font-weight="400">읽기·쓰기</text><text x="1250" y="687" font-size="21" fill="#243247" font-weight="400">앱의 읽기 요청 허용</text><path d="M 1175 330 V 370 H 995 V 435" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="995,435 987,417 1003,417" fill="#1673b8"/><text x="850" y="410" font-size="21" fill="#243247" font-weight="400">원본 엔드포인트</text><path d="M 1205 330 V 370 H 1385 V 435" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="1385,435 1377,417 1393,417" fill="#1673b8"/><text x="1250" y="410" font-size="21" fill="#243247" font-weight="400">복제본 엔드포인트</text><path d="M 1165 570 H 1215" fill="none" stroke="#db7200" stroke-width="4" marker-end="url(#orange)"/><polygon points="1215,570 1199,562 1199,578" fill="#db7200"/><text x="850" y="780" font-size="23" fill="#243247" font-weight="700">비동기 복제 · 최신 변경 반영 지연 가능</text><text x="850" y="830" font-size="22" fill="#243247" font-weight="400">앱이 읽기 연결을 분리해야 부하 분산</text><text x="55" y="930" font-size="22" fill="#243247" font-weight="400">두 기능은 함께 사용할 수 있다. 그림은 비교를 위해 분리했고 실제 복제본 AZ 배치는 구성에 따라 다를 수 있다.</text><text x="55" y="980" font-size="22" fill="#243247" font-weight="400">Multi-AZ DB 클러스터는 별도 배포 유형으로 읽기 가능한 인스턴스가 있다. 왼쪽 대기 DB와 혼동하지 않는다.</text><text x="55" y="1030" font-size="22" fill="#243247" font-weight="400">동기/비동기 화살표는 데이터 복제다. 복제본 생성만으로 앱의 모든 SQL이 자동 분산되지는 않는다.</text></g></svg>