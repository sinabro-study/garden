 font-weight="400">각 버전이 이전 버전 만료 조건 충족</text><text x="60" y="600" font-size="22" fill="#243247" font-weight="400">현재 데이터 버전이 있는 출발 상태</text><text x="580" y="600" font-size="21" fill="#243247" font-weight="400">Expiration만으로 이전 데이터는 안 지움</text><text x="1100" y="600" font-size="21" fill="#243247" font-weight="400">NoncurrentVersionExpiration 실행</text><text x="55" y="735" font-size="24" fill="#243247" font-weight="400">Enabled 버킷 예제 · ③은 모든 이전 데이터 버전이 만료되어 실제 정리된 이후다.</text><text x="55" y="785" font-size="23" fill="#243247" font-weight="400">삭제 마커 제거와 데이터 복구는 별개다. 이미 영구 삭제된 데이터는 마커를 지워도 돌아오지 않는다.</text></g></svg>