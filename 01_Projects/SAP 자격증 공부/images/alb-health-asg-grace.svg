</svg><text x="80" y="560" font-size="26" fill="#243247" font-weight="700">ASG</text><text x="300" y="450" font-size="27" fill="#243247" font-weight="700">설정 ① 대상 그룹 연결   +   ② ELB 헬스 체크 추가 활성화</text><text x="300" y="510" font-size="24" fill="#243247" font-weight="400">유예 중: 초기화에 따른 ALB 검사 실패만으로 너무 일찍 교체하지 않도록 기다림</text><text x="300" y="570" font-size="25" fill="#db7200" font-weight="700">유예 후: 해당 비정상 판정을 교체 판단에 반영하여 목표 대수를 유지</text><text x="60" y="690" font-size="23" fill="#243247" font-weight="400">유예 중이라도 인스턴스가 running 상태를 벗어나는 경우 등에는 교체될 수 있다.</text></g></svg>