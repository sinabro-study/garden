</svg><text x="1130" y="564" font-size="24" fill="#243247" font-weight="700">웹 B · SG-Web 연결</text><text x="1030" y="657" font-size="24" fill="#243247" font-weight="400">앱: HTTP 8080</text><text x="1030" y="704" font-size="23" fill="#243247" font-weight="400">/health → HTTP 200</text><text x="1030" y="750" font-size="24" fill="#26704b" font-weight="700">healthy (정상)</text><path d="M495 320 V342 H700 V515" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><path d="M700 342 H1260 V515" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="700,515 692,497 708,497" fill="#1673b8"/><polygon points="1260,515 1252,497 1268,497" fill="#1673b8"/><text x="50" y="435" font-size="23" fill="#1673b8" font-weight="700">ALB → EC2</text><text x="50" y="478" font-size="24" fill="#1673b8" font-weight="700">HTTP 8080</text><text x="50" y="535" font-size="22" fill="#243247" font-weight="400">앱 요청과 별개로</text><text x="50" y="574" font-size="22" fill="#243247" font-weight="400">/health를 주기적으로</text><text x="50" y="613" font-size="22" fill="#243247" font-weight="400">검사하여 상태 판단</text><text x="60" y="860" font-size="22" fill="#243247" font-weight="400">ALB는 AZ-A·AZ-B의 퍼블릭 서브넷을 선택한 인터넷용 구성이다. 그림은 논리적 요청 흐름을 단순화했다.</text><text x="60" y="902" font-size="22" fill="#243247" font-weight="400">프라이빗 EC2는 사설 IP로 접근한다. NAT는 이 요청 경로에 필요하지 않다. ALB가 서버를 새로 생성하지는 않는다.</text></g></svg>