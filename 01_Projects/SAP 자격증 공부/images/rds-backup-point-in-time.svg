</svg><text x="675" y="840" font-size="23" fill="#243247" font-weight="700">앱 연결 설정</text><path d="M790 770 H1240 V720" fill="none" stroke="#1673b8" stroke-width="4" marker-end="url(#blue)"/><polygon points="1240,720 1232,738 1248,738" fill="#1673b8"/><text x="890" y="820" font-size="23" fill="#243247" font-weight="400">검증 후 새 엔드포인트로 전환</text><text x="60" y="945" font-size="22" fill="#243247" font-weight="400">복원 시점 이후의 정상 변경은 새 DB에 자동 병합되지 않는다. 전환 전에 필요한 데이터와 접근 설정을 확인한다.</text><text x="60" y="995" font-size="22" fill="#243247" font-weight="400">Multi-AZ 장애 전환과 다르다. 복원은 별도 DB 생성이며 앱이 자동으로 새 DB를 사용하게 되는 것은 아니다.</text><text x="60" y="1040" font-size="22" fill="#243247" font-weight="400">수동 스냅샷 보존과 자동 백업 보존 기간은 별개다. 실제 AWS 자원 생성이나 연결 전환은 실행하지 않았다.</text></g></svg>