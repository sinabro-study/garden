<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1673b8"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#db7200"/></marker></defs><rect width="1600" height="1080" fill="white"/><g font-family="Apple SD Gothic Neo,Arial,sans-serif" fill="#243247"><text x="45" y="48" font-size="31" fill="#243247" font-weight="700">RDS 백업 복원: 과거 시점의 새 DB를 만들고 검증 후 연결</text><text x="45" y="90" font-size="23" fill="#243247" font-weight="400">일반 RDS for PostgreSQL · 예시 시각은 모두 KST · 복원 가능 범위 안의 13:59를 선택</text><rect x="35" y="125" width="1530" height="300" rx="8" fill="#fbfcfe" stroke="#7d9fbb" stroke-width="2" stroke-dasharray=""/><text x="60" y="170" font-size="26" fill="#243247" font-weight="700">과거 기록과 오류 발생 시점</text><path d="M140 260 H1460" stroke="#7d9fbb" stroke-width="4"/><circle cx="170" cy="260" r="9" fill="#1673b8"/><text x="125" y="225" font-size="23" fill="#1673b8" font-weight="700">09:00</text><text x="70" y="315" font-size="22" fill="#1673b8" font-weight="400">수동 스냅샷</text><circle cx="650" cy="260" r="9" fill="#26704b"/><text x="605" y="225" font-size="23" fill="#26704b" font-weight="700">13:59</text><text x="515" y="315" font-size="22" fill="#26704b" font-weight="400">원하는 복원 시점</text><circle cx="1060" cy="260" r="9" fill="#bd3636"/><text x="1015" y="225" font-size="23" fill="#bd3636" font-weight="700">14:00</text><text x="925" y="315" font-size="22" fill="#bd3636" font-weight="400">잘못된 삭제 COMMIT</text><circle cx="1430" cy="260" r="9" fill="#243247"/><text x="1385" y="225" font-size="23" fill="#243247" font-weight="700">16:00</text><text x="1295" y="315" font-size="22" fill="#243247" font-weight="400">오류 발견</text><text x="65" y="380" font-size="23" fill="#243247" font-weight="400">수동 스냅샷은 해당 스냅샷 시점 / PITR은 자동 백업·로그를 이용해 가능한 범위 안의 시점 선택</text><rect x="35" y="460" width="1530" height="445" rx="8" fill="#fcfaff" stroke="#8554a3" stroke-width="2" stroke-dasharray=""/>
