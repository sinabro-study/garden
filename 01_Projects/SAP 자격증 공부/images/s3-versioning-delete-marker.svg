</svg><text x="1175" y="508" font-size="24" fill="#243247" font-weight="700">vA · 이전 버전</text><text x="1175" y="548" font-size="22" fill="#243247" font-weight="400">내용: 원본</text><text x="65" y="650" font-size="24" fill="#26704b" font-weight="700">기본 GET → 수정본 vB</text><text x="585" y="780" font-size="22" fill="#bd3636" font-weight="700">기본 GET → 삭제된 것처럼 처리</text><text x="1105" y="650" font-size="22" fill="#243247" font-weight="400">dmZ만 제거 · 데이터 버전 유지</text><text x="1105" y="695" font-size="23" fill="#26704b" font-weight="700">기본 GET → 다시 수정본 vB</text><text x="60" y="860" font-size="23" fill="#243247" font-weight="400">버전 관리가 처음부터 Enabled인 예제다. 별도 영구 삭제·수명주기 정리는 없다. vA·vB·dmZ는 설명용 ID다.</text><text x="60" y="908" font-size="23" fill="#243247" font-weight="400">삭제 마커 제거와 데이터 버전 영구 삭제는 다르다. 복구 요청 전에 대상 키와 버전 ID를 구분한다.</text></g></svg>