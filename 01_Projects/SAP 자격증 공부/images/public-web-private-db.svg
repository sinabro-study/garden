</svg><text x="105" y="725" font-size="24" fill="#243247" font-weight="700">퍼블릭 NAT Gateway + Elastic IP</text><path d="M1265 550 V635 H335" fill="none" stroke="#db7200" stroke-width="4" marker-end="url(#orange)"/><text x="900" y="590" font-size="23" fill="#db7200" font-weight="700">③ DB의 업데이트 → NAT</text><polygon points="335,635 353,627 353,643" fill="#db7200"/><path d="M320 610 H785 V230" stroke="#db7200" stroke-width="4" fill="none"/><polygon points="785,230 777,248 793,248" fill="#db7200"/><text x="460" y="585" font-size="21" fill="#db7200" font-weight="700">NAT → IGW → 인터넷</text><text x="100" y="772" font-size="24" fill="#243247" font-weight="700">RT: local / 기본 경로 → IGW</text><text x="910" y="772" font-size="24" fill="#243247" font-weight="700">RT: local / 기본 경로 → NAT</text><text x="60" y="887" font-size="24" fill="#243247" font-weight="400">① 웹 공인 IPv4와 SG-Web의 443 허용   ② 양쪽 SG에서 TCP 3306 허용</text><text x="60" y="931" font-size="23" fill="#243247" font-weight="400">③ SG-DB 아웃바운드에서 업데이트 서버의 TCP 443 허용 · NAT Gateway에는 SG를 연결하지 않음</text><text x="60" y="978" font-size="22" fill="#243247" font-weight="400">경로·SG 통합을 위한 단일 AZ 예제다. 응답 화살표·DNS는 생략했으며 고가용성 구성은 별도 설계가 필요하다.</text></g></svg>